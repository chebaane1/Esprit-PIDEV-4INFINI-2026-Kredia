<header class="topbar">

  <button class="menu-btn" type="button" *ngIf="showMenuButton" (click)="menuToggle.emit()" aria-label="Toggle navigation">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>

  <!-- Search (hidden on simulator) / Back button (simulator only) -->
  <ng-container *ngIf="!isSimulateurPage; else backBtn">
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="Global search (Users, Transactions, Logs...)" />
    </div>
  </ng-container>

  <ng-template #backBtn>
    <button class="back-to-landing" (click)="goToLanding()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Back to Landing Page
    </button>
  </ng-template>

  <!-- Right actions -->
  <div class="topbar-actions">
    <span class="status-badge">
      <span class="status-dot"></span>
      System Live
    </span>
    <button class="icon-btn" (click)="toggleDarkMode()" title="Toggle dark mode">
      <span *ngIf="!darkModeService.isDarkMode()">🌙</span>
      <span *ngIf="darkModeService.isDarkMode()">☀️</span>
    </button>
    <div class="notification-wrapper">
      <button class="icon-btn" title="Notifications" (click)="toggleNotifications()">
        🔔
        <span class="notification-badge" *ngIf="hasUnread">{{ unreadCount > 9 ? '9+' : unreadCount }}</span>
      </button>

      <div class="notification-dropdown" *ngIf="showDropdown">
        <div class="dropdown-header">
          Notifications
          <span class="unread-label" *ngIf="unreadCount > 0">{{ unreadCount }} non lue{{ unreadCount > 1 ? 's' : '' }}</span>
        </div>
        <div class="dropdown-list" *ngIf="recentUpdates.length > 0; else noNotifs">
          <div class="dropdown-item" [class.unread]="isUnread(item)" *ngFor="let item of recentUpdates" (click)="goToTarget(item)">
            <div class="item-icon">{{ item.type === 'CREDIT' ? '💳' : (item.type === 'KYC' ? '📄' : '💰') }}</div>
            <div class="item-content">
              <span class="item-title">{{ item.title }}</span>
              <span class="item-date">{{ item.date | date:'short' }}</span>
            </div>
            <div class="item-right">
              <span class="unread-dot" *ngIf="isUnread(item)"></span>
              <div class="item-status" [ngClass]="item.status.toLowerCase()">
                {{ item.status }}
              </div>
            </div>
          </div>
        </div>
        <ng-template #noNotifs>
          <div class="dropdown-empty">No new notifications</div>
        </ng-template>
      </div>
    </div>
  </div>

</header>
